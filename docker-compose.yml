services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kidscrm
      POSTGRES_PASSWORD: kidscrm
      POSTGRES_DB: kidscrm
    ports:
      # 5433, а не 5432 — на машинах с локально установленным Postgres
      # (например, для другого проекта) порт 5432 уже занят. backend
      # ходит в этот контейнер по внутренней docker-сети как "db:5432",
      # порт на хост нужен только для внешнего клиента (DBeaver и т.п.).
      - "5433:5432"
    volumes:
      - kidscrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidscrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
      - ./docs:/docs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A config.celery worker --loglevel=info
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: celery -A config.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    # React (frontend2) собирается внутри образа и раздаётся nginx'ом на "/",
    # API и старые Django-страницы проксируются на backend (TRU-79,
    # infra/nginx/app.conf). После правок фронта: docker compose up -d --build nginx.
    # Для разработки фронта с горячей перезагрузкой — `npm run dev` во frontend2.
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  # WhatsApp по QR-коду для разработки — запускается только по запросу:
  #   docker compose exec db createdb -U kidscrm evolution   (один раз)
  #   docker compose --profile whatsapp up -d evolution
  # и в backend/.env: EVOLUTION_API_URL=http://evolution:8080,
  # EVOLUTION_API_KEY=dev-evolution-key, EVOLUTION_WEBHOOK_BASE_URL=http://backend:8000
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["whatsapp"]
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: dev-evolution-key
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://kidscrm:kidscrm@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: kidscrm_dev
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: KidsCRM
      LOG_LEVEL: ERROR,WARN,INFO
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  kidscrm_postgres_data:
  evolution_instances:
