services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kidscrm
      POSTGRES_PASSWORD: kidscrm
      POSTGRES_DB: kidscrm
    ports:
      # 5433, а не 5432 — на машинах с локально установленным Postgres
      # (например, для другого проекта) порт 5432 уже занят. backend
      # ходит в этот контейнер по внутренней docker-сети как "db:5432",
      # порт на хост нужен только для внешнего клиента (DBeaver и т.п.).
      - "5433:5432"
    volumes:
      - kidscrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidscrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  kidscrm_postgres_data:
