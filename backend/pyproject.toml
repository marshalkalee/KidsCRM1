[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "domains"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["domains", "config"]
omit = ["*/migrations/*", "*/tests.py", "*/tests/*"]

[tool.coverage.report]
skip_empty = true
precision = 1
