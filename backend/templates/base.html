{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        KidsCRM
      {% endblock title %}
    </title>
    <!-- Design-system: переиспользуемые классы .kc-*, см. static/site/css/kc.css -->
    <link rel="stylesheet"
          href="{% static 'site/css/vendor/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'site/css/kc.css' %}" />
    {% block extra_css %}
    {% endblock extra_css %}
  </head>
  <body>
    {% include "includes/navbar.html" %}
    <main class="kc-page-content">
      {% block content %}
      {% endblock content %}
    </main>
    <!-- Вендорные плагины без сборщика — см. static/site/js/vendor/README.md -->
    <script src="{% static 'site/js/vendor/jquery.min.js' %}"></script>
    <script src="{% static 'site/js/vendor/bootstrap.bundle.min.js' %}"></script>
    <!-- Своя i18n-система: бандл собран backend/scripts/build_i18n_bundle.py -->
    <script src="{% static 'site/js/i18n-bundle.js' %}"></script>
    <script src="{% static 'site/js/i18n.js' %}"></script>
    <script src="{% static 'site/js/app.js' %}"></script>
    {% block extra_js %}
    {% endblock extra_js %}
  </body>
</html>
