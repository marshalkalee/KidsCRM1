<header class="kc-header">
  <button type="button"
          class="kc-header__burger"
          id="kc-burger"
          aria-label="Меню">☰</button>
  {% include "includes/branch_switcher.html" %}
  {% if request.user.is_authenticated %}
    <div class="kc-header__user">
      <span class="kc-header__user-name">{{ request.user.full_name }}</span>
      <form method="post" action="{% url 'core:logout' %}" class="kc-inline-form">
        {% csrf_token %}
        <button type="submit" class="kc-btn" data-i18n="nav.logout">Выйти</button>
      </form>
    </div>
  {% endif %}
</header>
