{% extends "base.html" %}
{% load static %}
{% block page_title %}
  <span data-i18n="renewals.title">Продления</span>
{% endblock page_title %}
{% block content %}
  <div class="kc-filters-toggle-row">
    <button type="button" class="kc-btn kc-btn--secondary" data-filters-toggle>
      <span data-i18n="renewals.filters_toggle">Фильтры</span>
    </button>
    <span data-filters-count></span>
  </div>
  <div class="kc-list-layout">
    <aside class="kc-filters-panel" id="js-renewals-filters">
      <div class="kc-filters-panel__header">
        <strong data-i18n="renewals.filters_title">Фильтры</strong>
        <span data-filters-count></span>
      </div>
      <div class="kc-filters-panel__body">
        <label>
          <span data-i18n="renewals.filter_branch">Филиал</span>
          <select class="kc-form-input" data-filter="branch">
            <option value="" data-i18n="renewals.filter_any">Все</option>
            {% for branch in branches %}<option value="{{ branch.id }}">{{ branch.name }}</option>{% endfor %}
          </select>
        </label>
        <label>
          <span data-i18n="renewals.filter_direction">Направление</span>
          <select class="kc-form-input" data-filter="direction">
            <option value="" data-i18n="renewals.filter_any">Все</option>
            {% for direction in directions %}<option value="{{ direction.id }}">{{ direction.name }}</option>{% endfor %}
          </select>
        </label>
        <label>
          <span data-i18n="renewals.filter_group">Группа</span>
          <select class="kc-form-input" data-filter="group">
            <option value="" data-i18n="renewals.filter_any">Все</option>
            {% for group in groups %}<option value="{{ group.id }}">{{ group.name }}</option>{% endfor %}
          </select>
        </label>
      </div>
      <div class="kc-filters-panel__footer">
        <button type="button" class="kc-btn kc-btn--secondary" data-filters-reset>
          <span data-i18n="renewals.filters_reset">Сбросить</span>
        </button>
      </div>
    </aside>
    <div class="kc-list-layout__main">
      <div id="js-renewals-table"></div>
    </div>
  </div>
{% endblock content %}
{% block extra_js %}
  <script>
    (function () {
      "use strict";
      var t = window.KidsCRM.t;

      var columns = [
        { key: "child_name", label: t("renewals.col_child") },
        { key: "parent_name", label: t("renewals.col_parent") },
        { key: "sessions_remaining", label: t("renewals.col_sessions") },
        { key: "ends_on", label: t("renewals.col_ends_on"), sortable: true },
        { key: "group_name", label: t("renewals.col_group") },
        {
          key: "last_contacted", label: t("renewals.col_contacted"),
          render: function (row) { return row.last_contacted || "—"; },
        },
        {
          key: "actions", label: "",
          render: function (row) {
            var wrap = document.createElement("span");
            if (row.call_url) {
              var call = document.createElement("a");
              call.href = row.call_url;
              call.className = "kc-btn kc-btn--icon";
              call.textContent = "📞";
              wrap.appendChild(call);
            }
            if (row.whatsapp_url) {
              var wa = document.createElement("a");
              wa.href = row.whatsapp_url;
              wa.target = "_blank";
              wa.className = "kc-btn kc-btn--icon";
              wa.textContent = "WhatsApp";
              wrap.appendChild(wa);
            }
            var contacted = document.createElement("button");
            contacted.type = "button";
            contacted.className = "kc-btn kc-btn--secondary";
            contacted.textContent = t("renewals.mark_contacted");
            contacted.addEventListener("click", function () {
              $.post("/subscriptions/renewals/" + row.subscription_id + "/contacted/").done(function () {
                window.KidsCRM.toast.success(t("renewals.contacted_saved"));
                table.reload();
              });
            });
            wrap.appendChild(contacted);

            var sell = document.createElement("button");
            sell.type = "button";
            sell.className = "kc-btn kc-btn--primary";
            sell.textContent = t("renewals.sell");
            sell.addEventListener("click", function () {
              window.KidsCRM.formModal
                .open({ url: "/subscriptions/renewals/" + row.subscription_id + "/sell/", title: t("renewals.sale_title") })
                .then(function (saved) { if (saved) { table.reload(); } });
            });
            wrap.appendChild(sell);
            return wrap;
          },
        },
      ];

      var table = window.KidsCRM.table.init("#js-renewals-table", {
        columns: columns,
        pageSize: 50,
        rowKey: function (row) { return row.subscription_id; },
        remote: { url: "{% url 'subscriptions_web:renewals-data' %}" },
      });

      var filtersPanel = window.KidsCRM.filtersPanel.init(
        document.getElementById("js-renewals-filters"),
        { storageKey: "renewals_filters", onChange: function (values) { table.setRemoteParams(values); } }
      );

      table.on("load", function (data) { filtersPanel.setCount(data.total); });
    })();
  </script>
{% endblock extra_js %}
