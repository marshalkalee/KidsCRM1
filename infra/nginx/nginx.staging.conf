# Staging/прод: HTTPS через Let's Encrypt (certbot, см. docker-compose.staging.yml).
#
# Первый запуск на новом сервере (когда появится домен и DNS будет
# указывать на сервер) — сертификата ещё нет, поэтому:
# 1. Временно закомментировать блок "server { listen 443 ... }" ниже и
#    убрать redirect на https из блока :80.
# 2. Поднять nginx только с блоком :80 (обслуживает /.well-known/acme-challenge/).
# 3. docker compose -f docker-compose.staging.yml run --rm certbot \
#      certbot certonly --webroot -w /var/www/certbot -d <домен>
# 4. Вернуть файл к этому виду (оба блока), перезапустить nginx.
# Дальше продление сертификата уже автоматическое — сервис `certbot` в
# docker-compose.staging.yml сам его продлевает каждые 12 часов проверки.

events {}

http {
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Домен подставляется при бутстрапе сервера — см. README "Staging и деплой".
        ssl_certificate     /etc/letsencrypt/live/STAGING_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/STAGING_DOMAIN/privkey.pem;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
