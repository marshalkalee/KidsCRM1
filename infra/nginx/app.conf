# Общие правила маршрутизации (TRU-79) — подключаются из nginx.conf (дев)
# и nginx.staging.conf внутри server { ... }.
#
# React (frontend2) — на "/", Django — только API, админка, статика и
# старые серверные страницы на время переезда (эпик TRU-78, удаляются в
# TRU-88). Старые Django-адреса отличаются от React-маршрутов слешем на
# конце: /groups/ и /groups/<uuid>/ — Django (APPEND_SLASH), /groups и
# /groups/<uuid> — React. Поэтому на Django уходят старые разделы, только
# если путь заканчивается на "/".

root /usr/share/nginx/html;

# backend ищется DNS'ом docker при каждом запросе, а не один раз при
# старте nginx: иначе nginx падает («host not found in upstream»), если
# стартует раньше backend или backend перезапускается. Пока backend не
# поднялся — 502 на API, а React-страницы при этом отдаются.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:8000;

# Django: API, админка, статика и загрузки.
location ^~ /api/    { proxy_pass $backend; }
location ^~ /admin/  { proxy_pass $backend; }
location ^~ /static/ { proxy_pass $backend; }
location ^~ /media/  { proxy_pass $backend; }

# Старые серверные страницы (до TRU-88).
location ~ ^/(clients|settings|groups|onboarding|signup|login|logout|switch-branch|switch-language|dev|healthz)(/.*)?/$ {
    proxy_pass $backend;
}

# Сборка Vite — имена файлов с хешем, можно кэшировать надолго.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# React-маршруты (SPA): любой неизвестный путь отдаёт index.html,
# маршрут разбирает react-router. index.html не кэшируем — иначе после
# деплоя браузер держит старую сборку.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
